<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14181c" />
<title>Letterboxd Roulette</title>
<style>
  :root {
    --bg: #14181c; --panel: #1c2228; --panel2: #232a32; --line: #2c3440; --text: #d8e0e8; --muted: #8899aa;
    --orange: #ff8000; --green: #00e054; --blue: #40bcf4; --red: #ff5c5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 10px; font-weight: 600; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 17px; }
  input:focus { outline: 2px solid var(--blue); border-color: transparent; }
  input.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; }
  button { width: 100%; padding: 15px 18px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 700;
    font-size: 16px; background: var(--green); color: #0b1a10; touch-action: manipulation; }
  button.orange { background: var(--orange); color: #1a0e00; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.link { background: none; color: var(--muted); width: auto; padding: 8px; font-weight: 500; text-decoration: underline; }
  button:disabled { opacity: .45; cursor: default; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .or { text-align: center; color: var(--muted); margin: 18px 0; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .err { color: var(--red); min-height: 1.4em; margin-top: 10px; }
  .roomcode { font-size: 52px; font-weight: 800; letter-spacing: .15em; text-align: center; color: #fff; line-height: 1.1; }
  .qr { display: flex; justify-content: center; margin: 14px 0 6px; }
  .qr canvas, .qr img { background: #fff; padding: 10px; border-radius: 8px; width: 180px !important; height: 180px !important; }
  .joinurl { text-align: center; word-break: break-all; font-size: 13px; color: var(--blue); }
  .players { display: grid; gap: 8px; }
  .player { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  .player.off { opacity: .45; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
    color: #111; flex: none; font-size: 15px; }
  .player .name { flex: 1; min-width: 0; }
  .player .name b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .score { font-weight: 800; font-size: 20px; color: #fff; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--panel2); color: var(--muted); margin-left: 6px; font-weight: 600; vertical-align: middle; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { background: none; color: var(--muted); padding: 10px 0; }
  .seg button.on { background: var(--panel2); color: #fff; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .topbar b { color: #fff; }
  .timer { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .timer i { display: block; height: 100%; background: var(--green); width: 100%; transition: width .25s linear; }
  .timer.low i { background: var(--red); }
  .review { font-size: 18px; line-height: 1.55; max-height: 46vh; overflow: auto; }
  .review p { white-space: pre-wrap; }
  .review p:last-child { margin-bottom: 0; }
  .spoiler { color: var(--orange); font-size: 13px; margin-bottom: 8px; }
  .opts { display: grid; gap: 8px; }
  .opts.people { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .opt { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); font-weight: 600; padding: 13px 14px; }
  .opt.sel { border-color: var(--blue); background: #1b3442; color: #fff; }
  .opt.right { border-color: var(--green); background: #12301f; color: #fff; }
  .opt.wrong { border-color: var(--red); background: #3a1a1a; }
  .waiting { text-align: center; padding: 18px; color: var(--muted); }
  .answered-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .answered-row span { font-size: 12px; padding: 4px 9px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
  .answered-row span.done { background: #12301f; color: var(--green); }
  .reveal { display: flex; gap: 14px; align-items: center; animation: pop .4s ease; }
  .reveal img { width: 84px; border-radius: 5px; box-shadow: 0 6px 20px #000a; flex: none; }
  .reveal .film { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.2; }
  .reveal .film a { color: inherit; text-decoration: none; }
  .stars { color: var(--green); letter-spacing: 1px; }
  .heart { color: var(--orange); }
  .gain { text-align: center; font-size: 30px; font-weight: 800; margin: 16px 0 4px; animation: pop .4s ease; }
  .gain.zero { color: var(--muted); font-size: 22px; }
  .gain.pos { color: var(--green); }
  .res { font-size: 13px; color: var(--muted); }
  .ok { color: var(--green); } .no { color: var(--red); }
  .podium { text-align: center; padding: 10px 0 4px; }
  .podium .trophy { font-size: 54px; }
  .podium .winner { font-size: 26px; font-weight: 800; color: #fff; }
  .footer { margin-top: 22px; display: grid; gap: 10px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const app = document.getElementById("app");
const COLORS = ["#ff8000", "#00e054", "#40bcf4", "#ff5ca8", "#ffd23f", "#b48cff", "#5cffd6", "#ff7a5c", "#9fe870", "#7ab8ff", "#ffa8e0", "#e0c080"];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stars = (r) => (r == null ? "" : "★".repeat(Math.floor(r)) + (r % 1 ? "½" : ""));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let session = store.get("lbr-session"); // { code, pid }
let state = null, es = null, lanUrls = [];
let pick = { round: 0, person: null, film: null };
let busy = false, errMsg = "";
const draft = { name: store.get("lbr-name") || "", code: "" };
let timerInt = null, localDeadline = 0;

fetch("/api/info").then((r) => r.json()).then((d) => { lanUrls = d.lanUrls || []; if (state?.phase === "lobby") render(); }).catch(() => {});

async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}
const act = (action, extra) => api(`/api/rooms/${session.code}/${action}`, { pid: session.pid, ...extra });

async function run(fn) {
  if (busy) return;
  busy = true; errMsg = ""; render();
  try { await fn(); } catch (e) { errMsg = e.message; }
  busy = false; render();
}

// ---------- connection ----------
async function connect() {
  if (!session) return render();
  try {
    const r = await fetch(`/api/rooms/${session.code}/state?pid=${session.pid}`);
    if (r.status === 403 || r.status === 404) { leaveLocal(); errMsg = "That game has ended."; return render(); }
    if (r.ok) { state = await r.json(); render(); }
  } catch {}
  es?.close();
  es = new EventSource(`/api/rooms/${session.code}/events?pid=${session.pid}`);
  es.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  es.onerror = () => { if (es.readyState === 2) setTimeout(connect, 2000); };
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && session && (!es || es.readyState === 2)) connect();
});

function leaveLocal() {
  es?.close(); es = null; session = null; state = null; store.del("lbr-session");
  history.replaceState(null, "", "/");
}

// ---------- views ----------
function render() {
  const y = window.scrollY;
  clearInterval(timerInt);
  if (!session || !state) app.innerHTML = session ? `<p class="waiting">Connecting…</p>` : homeView();
  else app.innerHTML = ({ lobby: lobbyView, question: questionView, reveal: revealView, over: overView })[state.phase]();
  if (state?.phase === "lobby") drawQR();
  if (state?.phase === "question") startTimer();
  window.scrollTo(0, y);
}

const header = (sub) => `
  <h1><span class="dots"><i style="background:var(--orange)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></span>Letterboxd Roulette</h1>
  ${sub ? `<p class="muted">${sub}</p>` : ""}`;

function homeView() {
  const roomParam = new URLSearchParams(location.search).get("room") || "";
  const name = draft.name;
  return `${header("Everyone adds their Letterboxd. Read a random review, then guess the film and who wrote it.")}
    <div class="stack" style="margin-top:18px">
      <input id="name" placeholder="Your Letterboxd username" value="${esc(name)}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" />
    </div>
    ${roomParam ? "" : `
      <div class="stack" style="margin-top:10px">
        <button onclick="createGame()" ${busy ? "disabled" : ""}>${busy ? "Loading your reviews…" : "Host a new game"}</button>
      </div>
      <div class="or">or join a friend's game</div>`}
    <div class="stack" ${roomParam ? 'style="margin-top:10px"' : ""}>
      <input id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(draft.code || roomParam.toUpperCase())}" autocapitalize="characters" autocorrect="off" spellcheck="false" />
      <button class="${roomParam ? "" : "orange"}" onclick="joinGame()" ${busy ? "disabled" : ""}>${busy && roomParam ? "Loading your reviews…" : "Join game"}</button>
    </div>
    <div class="err">${esc(errMsg)}</div>
    <p class="small muted" style="margin-top:18px">Pulls each player's ~50 most recent Letterboxd diary entries and plays with the ones that have written reviews. <a href="/solo" style="color:var(--blue)">Solo mode →</a></p>`;
}

function enter(data) {
  session = { code: data.code, pid: data.playerId };
  store.set("lbr-session", session);
  history.replaceState(null, "", `/?room=${data.code}`);
  connect();
}
function readInputs() {
  draft.name = document.getElementById("name")?.value.trim().replace(/^@/, "") ?? draft.name;
  draft.code = document.getElementById("code")?.value.trim().toUpperCase() ?? draft.code;
  if (draft.name) store.set("lbr-name", draft.name);
}
const fail = (m) => { errMsg = m; render(); };
window.createGame = () => {
  readInputs();
  if (!draft.name) return fail("Enter your Letterboxd username");
  run(async () => enter(await api("/api/rooms", { username: draft.name })));
};
window.joinGame = () => {
  readInputs();
  if (!draft.name) return fail("Enter your Letterboxd username");
  if (draft.code.length !== 4) return fail("Enter the 4-letter room code");
  run(async () => enter(await api(`/api/rooms/${draft.code}/join`, { username: draft.name })));
};

const me = () => state.players.find((p) => p.id === state.you);
const isHost = () => state.hostId === state.you;
const color = (id) => COLORS[Math.max(0, state.players.findIndex((p) => p.id === id)) % COLORS.length];
const nameOf = (id) => state.players.find((p) => p.id === id)?.displayName ?? "?";
const avatar = (p) => `<div class="avatar" style="background:${color(p.id)}">${esc(p.displayName[0]?.toUpperCase() || "?")}</div>`;

function joinUrl() {
  const local = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
  const base = local && lanUrls[0] ? lanUrls[0] : location.origin;
  return `${base}/?room=${state.code}`;
}
function drawQR() {
  const el = document.getElementById("qr");
  if (!el || typeof QRCode === "undefined") return;
  new QRCode(el, { text: joinUrl(), width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
}

function lobbyView() {
  const pool = state.players.reduce((n, p) => n + p.reviewCount, 0);
  const rounds = [10, 20, 30];
  return `${header()}
    <div class="card" style="margin-top:14px">
      <div class="muted small" style="text-align:center">Room code</div>
      <div class="roomcode">${esc(state.code)}</div>
      <div class="qr" id="qr"></div>
      <div class="joinurl">${esc(joinUrl())}</div>
      <div class="row" style="margin-top:12px"><button class="ghost" onclick="shareLink()">Share invite link</button></div>
    </div>

    <h2>Players (${state.players.length})</h2>
    <div class="players">${state.players.map((p) => `
      <div class="player ${p.connected ? "" : "off"}">
        ${avatar(p)}
        <div class="name"><b>${esc(p.displayName)}${p.id === state.hostId ? '<span class="tag">HOST</span>' : ""}${p.id === state.you ? '<span class="tag">YOU</span>' : ""}</b>
          <span class="small ${p.reviewCount ? "muted" : "no"}">${p.reviewCount ? `${p.reviewCount} recent reviews` : "no recent written reviews"}</span></div>
      </div>`).join("")}
    </div>
    <p class="small muted" style="margin-top:10px">${pool} reviews in the pool.
      ${state.players.length < 2 ? "Solo: just guess the film. Add friends to also guess who wrote it." : "Guess the film (+1) and who wrote it (+1). Your own reviews are in there too!"}</p>

    ${isHost() ? `
      <h2>Rounds</h2>
      <div class="seg">${rounds.map((n) => `<button class="${state.totalRounds === n ? "on" : ""}" onclick="setRounds(${n})">${n}</button>`).join("")}</div>
      <div class="footer"><button onclick="startGame()" ${busy || !pool ? "disabled" : ""}>Start game · ${Math.min(state.totalRounds, pool)} rounds</button></div>`
    : `<div class="waiting">Waiting for ${esc(nameOf(state.hostId))} to start…</div>`}
    <div class="err">${esc(errMsg)}</div>
    <div style="text-align:center"><button class="link" onclick="leaveGame()">Leave room</button></div>`;
}
window.shareLink = async () => {
  const url = joinUrl();
  try {
    if (navigator.share) await navigator.share({ title: "Letterboxd Roulette", text: `Join my game: ${state.code}`, url });
    else { await navigator.clipboard.writeText(url); errMsg = "Link copied!"; render(); }
  } catch {}
};
window.setRounds = (n) => run(() => act("settings", { rounds: n }));
window.startGame = () => run(() => act("start"));
window.leaveGame = () => run(async () => { try { await act("leave"); } catch {} leaveLocal(); });

function topbar() {
  return `<div class="topbar"><span class="muted">Round <b>${state.roundNumber}</b> / ${state.roundCount}</span>
    <span class="muted">You: <b>${me()?.score ?? 0}</b> pts</span></div>`;
}
function reviewCard() {
  const r = state.round;
  return `<div class="card">
    ${r.spoilers ? '<div class="spoiler">⚠ May contain spoilers</div>' : ""}
    <div class="review">${r.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
  </div>`;
}

function questionView() {
  const r = state.round;
  if (pick.round !== state.roundNumber) pick = { round: state.roundNumber, person: null, film: null };
  const answeredRow = `<div class="answered-row">${state.players.filter((p) => p.connected).map((p) =>
    `<span class="${p.answered ? "done" : ""}">${p.answered ? "✓ " : ""}${esc(p.displayName)}</span>`).join("")}</div>`;
  const controls = state.canControl ? `<div style="text-align:center"><button class="link" onclick="revealNow()">Reveal now</button></div>` : "";

  let body;
  if (r.yourAnswer) {
    body = `<div class="waiting">🔒 Locked in. Waiting for everyone else…</div>${answeredRow}${controls}`;
  } else {
    const people = state.players;
    const ready = pick.film && (!state.askPerson || pick.person);
    body = `
      ${state.askPerson ? `<h2>Who wrote it?</h2>
        <div class="opts people">${people.map((p) =>
          `<button class="opt ${pick.person === p.id ? "sel" : ""}" onclick="choose('person','${p.id}')">${p.id === state.you ? "Me 👀" : esc(p.displayName)}</button>`).join("")}</div>` : ""}
      <h2>Which film?</h2>
      <div class="opts">${r.filmOptions.map((o, i) =>
        `<button class="opt ${pick.film === o.key ? "sel" : ""}" onclick="choose('film',${i})">${esc(o.label)}</button>`).join("")}</div>
      <div class="footer"><button onclick="lockIn()" ${!ready || busy ? "disabled" : ""}>Lock in</button></div>
      ${answeredRow}${controls}`;
  }
  return `${topbar()}
    <div class="timer" id="timer"><i></i></div>
    ${reviewCard()}
    ${body}
    <div class="err">${esc(errMsg)}</div>`;
}
window.choose = (kind, v) => {
  pick[kind] = kind === "film" ? state.round.filmOptions[v].key : v;
  render();
};
window.lockIn = () => run(() => act("answer", { person: pick.person, film: pick.film }));
window.revealNow = () => run(() => act("reveal"));

function startTimer() {
  const el = document.getElementById("timer");
  if (!el) return;
  localDeadline = Date.now() + state.round.remainingMs;
  const tick = () => {
    const left = Math.max(0, localDeadline - Date.now());
    el.firstElementChild.style.width = `${(left / state.questionMs) * 100}%`;
    el.classList.toggle("low", left < 10_000);
  };
  tick();
  timerInt = setInterval(tick, 250);
}

function revealView() {
  const r = state.round, a = r.answer;
  const mine = a.results.find((x) => x.id === state.you);
  const author = state.players.find((p) => p.id === a.authorId);
  let gain = "";
  const yours = a.authorId === state.you && state.players.length > 1;
  if (mine) gain = `<div class="gain ${mine.gained ? "pos" : "zero"}">${mine.gained ? `+${mine.gained} point${mine.gained > 1 ? "s" : ""}!` : yours && !mine.personRight ? "You didn't recognise your own review 😅" : "No points this time"}</div>`;
  else gain = `<div class="gain zero">⏱ Out of time</div>`;
  if (yours) gain += `<div class="muted" style="text-align:center">That one was yours!</div>`;

  const filmLabel = (key) => r.filmOptions.find((o) => o.key === key)?.label ?? "-";
  const results = a.results.length ? a.results.map((x) => `
    <div class="res">${esc(nameOf(x.id))}:
      ${state.askPerson ? `<span class="${x.personRight ? "ok" : "no"}">${x.personRight ? "✓" : "✗"} ${esc(nameOf(x.person))}</span> · ` : ""}
      <span class="${x.filmRight ? "ok" : "no"}">${x.filmRight ? "✓" : "✗"} ${esc(filmLabel(x.film))}</span></div>`).join("")
    : `<div class="res">Nobody answered.</div>`;

  const last = state.roundNumber >= state.roundCount;
  return `${topbar()}
    <div class="card">
      <div class="reveal">
        ${a.poster ? `<img src="${esc(a.poster)}" alt="">` : ""}
        <div>
          <div class="film"><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.film)}</a> <span class="muted" style="font-weight:400;font-size:16px">${esc(a.year)}</span></div>
          <div class="muted" style="margin-top:4px">by <b style="color:${color(a.authorId)}">${esc(author?.displayName ?? "?")}</b></div>
          <div><span class="stars">${stars(a.rating)}</span> ${a.liked ? '<span class="heart">♥</span>' : ""}</div>
        </div>
      </div>
    </div>
    ${gain}
    <div class="card" style="margin-top:12px">
      <div class="review" style="font-size:15px;max-height:22vh">${r.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    </div>
    <h2>Answers</h2>
    <div class="stack" style="gap:4px">${results}</div>
    <h2>Scores</h2>
    ${scoreboard()}
    <div class="footer">
      ${state.canControl ? `<button onclick="nextRound()" ${busy ? "disabled" : ""}>${last ? "See final scores" : "Next round →"}</button>`
        : `<div class="waiting">Waiting for ${esc(nameOf(state.hostId))} to continue…</div>`}
    </div>
    <div class="err">${esc(errMsg)}</div>`;
}
window.nextRound = () => run(() => act("next"));

function scoreboard() {
  const sorted = [...state.players].sort((a, b) => b.score - a.score);
  return `<div class="players">${sorted.map((p, i) => `
    <div class="player ${p.connected ? "" : "off"}">
      <span class="muted" style="width:18px;text-align:center;font-weight:700">${i + 1}</span>
      ${avatar(p)}
      <div class="name"><b>${esc(p.displayName)}${p.id === state.you ? '<span class="tag">YOU</span>' : ""}</b></div>
      <div class="score">${p.score}</div>
    </div>`).join("")}</div>`;
}

function overView() {
  const sorted = [...state.players].sort((a, b) => b.score - a.score);
  const top = sorted[0]?.score ?? 0;
  const winners = sorted.filter((p) => p.score === top);
  const max = state.roundCount * (state.askPerson ? 2 : 1);
  return `${header()}
    <div class="podium">
      <div class="trophy">🏆</div>
      <div class="winner">${winners.map((w) => esc(w.displayName)).join(" & ")} ${winners.length > 1 ? "tie!" : "wins!"}</div>
      <div class="muted">${top} / ${max} points</div>
    </div>
    <h2>Final scores</h2>
    ${scoreboard()}
    <div class="footer">
      ${isHost() ? `<button onclick="playAgain()" ${busy ? "disabled" : ""}>Play again</button>`
        : `<div class="waiting">Waiting for ${esc(nameOf(state.hostId))} to start another…</div>`}
      <button class="ghost" onclick="leaveGame()">Leave</button>
    </div>
    <div class="err">${esc(errMsg)}</div>`;
}
window.playAgain = () => run(() => act("lobby"));

// Enter key on the home screen
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || session) return;
  if (e.target.id === "code" || new URLSearchParams(location.search).get("room")) joinGame(); else createGame();
});

connect();
</script>
</body>
</html>
